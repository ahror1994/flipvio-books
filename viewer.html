<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>Flipvio</title>
<link rel="stylesheet" href="/assets/viewer.css?v=44" />
</head>
<body>
<div id="loader"><div class="spin"></div><span>Загрузка книги…</span></div>

<div id="app">
  <a id="brand" target="_blank" rel="noopener noreferrer" hidden><img alt="Логотип" /></a>
  <div id="stage">
    <button id="navLeft" class="nav-arrow" title="Назад (←)" aria-label="Назад">‹</button>
    <div id="book">
      <img id="imgLeft" alt="" draggable="false" />
      <img id="imgRight" alt="" draggable="false" />
      <div id="gutter"></div>
      <canvas id="gl"></canvas>
      <div id="overlays"></div>
    </div>
    <button id="navRight" class="nav-arrow" title="Вперёд (→)" aria-label="Вперёд">›</button>
  </div>

  <div id="toolbar">
    <button data-act="panel" title="Миниатюры и оглавление" hidden><svg class="i" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><line x1="9" y1="3" x2="9" y2="21"/><line x1="13" y1="8" x2="17" y2="8"/><line x1="13" y1="12" x2="17" y2="12"/></svg></button>
    <button data-act="first" title="Первая страница"><svg class="i" viewBox="0 0 24 24"><polyline points="11 17 6 12 11 7"/><polyline points="18 17 13 12 18 7"/></svg></button>
    <button data-act="prev" title="Назад (←)"><svg class="i" viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg></button>
    <span id="pageBox"><input id="pageInput" inputmode="numeric" /> / <b id="pageTotal">0</b></span>
    <button data-act="next" title="Вперёд (→)"><svg class="i" viewBox="0 0 24 24"><polyline points="9 18 15 12 9 6"/></svg></button>
    <button data-act="last" title="Последняя страница"><svg class="i" viewBox="0 0 24 24"><polyline points="13 17 18 12 13 7"/><polyline points="6 17 11 12 6 7"/></svg></button>
    <i class="sep"></i>
    <button data-act="zoom" title="Зум"><svg class="i" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/><line x1="11" y1="8" x2="11" y2="14"/><line x1="8" y1="11" x2="14" y2="11"/></svg></button>
    <button data-act="auto" title="Автолистание"><svg class="i" viewBox="0 0 24 24"><polygon points="6 4 20 12 6 20 6 4"/></svg></button>
    <button data-act="sound" title="Звук"><svg class="i" viewBox="0 0 24 24"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14"/></svg></button>
    <button data-act="single" title="Одна/две страницы"><svg class="i" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><line x1="12" y1="4" x2="12" y2="20"/></svg></button>
    <button data-act="share" title="Поделиться"><svg class="i" viewBox="0 0 24 24"><path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8"/><polyline points="16 6 12 2 8 6"/><line x1="12" y1="2" x2="12" y2="15"/></svg></button>
    <button data-act="print" title="Печать"><svg class="i" viewBox="0 0 24 24"><polyline points="6 9 6 2 18 2 18 9"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8"/></svg></button>
    <button data-act="download" title="Скачать PDF"><svg class="i" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg></button>
    <button data-act="full" title="На весь экран"><svg class="i" viewBox="0 0 24 24"><path d="M8 3H5a2 2 0 0 0-2 2v3"/><path d="M21 8V5a2 2 0 0 0-2-2h-3"/><path d="M16 21h3a2 2 0 0 0 2-2v-3"/><path d="M3 16v3a2 2 0 0 0 2 2h3"/></svg></button>
  </div>

  <aside id="panel">
    <header>
      <nav class="tabs">
        <button class="tab" data-tab="toc" hidden>Оглавление</button>
        <button class="tab" data-tab="thumbs">Страницы</button>
      </nav>
      <button data-act="panel" title="Закрыть">×</button>
    </header>
    <div id="tocList" hidden></div>
    <div id="thumbList"></div>
  </aside>

  <div id="zoomView" hidden style="display: none !important;">
    <div id="zoomInner"><img id="zoomImg" alt="" /></div>
    <button id="zoomClose">×</button>
  </div>

  <div id="shareView" hidden style="display: none !important;">
    <div class="card">
      <h3>Поделиться</h3>
      <label>Ссылка на текущую страницу<input id="shareLink" readonly /></label>
      <label>Код для встраивания<textarea id="shareEmbed" readonly rows="3"></textarea></label>
      <div class="row"><button id="shareCopy">Копировать ссылку</button><button id="shareQr" data-act="qr">QR-код</button><button id="shareClose">Закрыть</button></div>
      <div id="qrBox" hidden><p id="qrStatus" role="status"></p><img id="qrImg" alt="QR-код" /><div class="row"><button id="qrDownload" disabled>Скачать QR</button></div></div>
    </div>
  </div>
</div>

<script src="/assets/viewer.js?v=51"></script>
</body>
</html>
